<section class="flex">
    <mat-toolbar class="header">
        <div class="flex items-center gap-2">
            <button matIconButton class="botonMenu" (click)="sidenav.toggle();"
                [matTooltip]="sidenav.opened ? 'Cerrar menú' : 'Abrir menú'" matTooltipPosition="right"
                [disabled]="!this.authService.isLoggedIn()">
                <mat-icon>menu</mat-icon>
            </button>
            <mat-icon class="text-[#FCDC4D]!">hotel</mat-icon>
            <span class="font-bold! text-[1.15rem]!">Gestión Hotel</span>
        </div>
        <div class="me-4 flex">
            <button mat-icon-button [matMenuTriggerFor]="menu" #menuTrigger class="botonMenu">
                <mat-icon>person</mat-icon>
            </button>
        </div>
        <mat-menu #menu="matMenu">
            <button mat-menu-item [routerLink]="['/login']" [hidden]="this.authService.isLoggedIn()">Iniciar sesión</button>
            <button mat-menu-item (click)="loggout()" [hidden]="!this.authService.isLoggedIn()">Cerrar sesión</button>
            <mat-divider></mat-divider>
            <button mat-menu-item [hidden]="!this.authService.isLoggedIn()">Cambiar contraseña</button>
        </mat-menu>
    </mat-toolbar>

    <mat-sidenav-container class="container">
    <mat-sidenav #sidenav mode="side" class="sidenav" [opened]="authService.isLoggedIn()">
            <mat-nav-list>
                <mat-list-item class="usuario">
                    <span class="flex items-center gap-2">
                        <mat-icon>account_circle</mat-icon>
                        {{authService.userActualS().username}}
                    </span>
                </mat-list-item>
                <mat-divider class="my-2!"></mat-divider>
                @for(item of menuItems; track item.label) {
                    <a mat-list-item class="opcion" [routerLink]="item.route" routerLinkActive="activo">
                        <span class="flex items-center gap-3">
                            <mat-icon>{{item.icon}}</mat-icon>
                            {{item.label}}
                        </span>
                    </a>
                }
            </mat-nav-list>
        </mat-sidenav>
        <mat-sidenav-content class="contenido">
            <router-outlet />
        </mat-sidenav-content>
    </mat-sidenav-container>
</section>
