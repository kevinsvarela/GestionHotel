<h2 mat-dialog-title class="text-center pt-5!">
    <mat-icon class="text-[2.5rem]! w-10! h-10!" [class]="colorIcono()">{{data.icono}}</mat-icon>
</h2>
<mat-dialog-content>
    <p class="text-center whitespace-pre-line">{{data.texto}}</p>
</mat-dialog-content>
<mat-dialog-actions align="center">
    @if(data.textoCancelar) {
        <button mat-button mat-dialog-close cdkFocusInitial class="text-[#352D39]!">{{data.textoCancelar}}</button>
    }
    @if(data.textoAceptar) {
        <button mat-flat-button [mat-dialog-close]="true" class="bg-[#155600]! text-white!">{{data.textoAceptar}}</button>
    }
</mat-dialog-actions>
