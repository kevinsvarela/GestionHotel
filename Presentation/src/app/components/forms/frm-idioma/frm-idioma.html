<div class="dlg-encabezado">
  <span class="icono-titulo"><mat-icon>translate</mat-icon></span>
  <div class="flex-1">
    <h2 class="dlg-titulo">{{ titulo }}</h2>
    <p class="dlg-subtitulo">Idioma que pueden hablar los guías</p>
  </div>
  <button mat-icon-button type="button" class="dlg-cerrar" [mat-dialog-close]="false" aria-label="Cerrar">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dlg-contenido">
  <form id="frmIdioma" [formRoot]="frmIdioma" class="grid gap-3 pt-3">
    <mat-form-field appearance="outline">
      <mat-label>Nombre del idioma</mat-label>
      <input matInput placeholder="Inglés" autocomplete="off" [formField]="frmIdioma.nombre" />
      @if (frmIdioma.nombre().touched() && frmIdioma.nombre().invalid()) {
        @for (error of frmIdioma.nombre().errors(); track error.kind) {
          <mat-error>{{ error.message }}</mat-error>
        }
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<div class="dlg-pie">
  <button type="button" class="boton-borde" [mat-dialog-close]="false">Cancelar</button>
  <button type="submit" form="frmIdioma" class="boton-lleno"><mat-icon>check</mat-icon>Guardar</button>
</div>
