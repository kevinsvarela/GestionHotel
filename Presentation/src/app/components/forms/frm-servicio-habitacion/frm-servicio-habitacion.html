<div class="dlg-encabezado">
  <span class="icono-titulo"><mat-icon>room_service</mat-icon></span>
  <div class="flex-1">
    <h2 class="dlg-titulo">{{ titulo }}</h2>
    <p class="dlg-subtitulo">Servicio que puede incluir un tipo de habitación</p>
  </div>
  <button mat-icon-button type="button" class="dlg-cerrar" [mat-dialog-close]="false" aria-label="Cerrar">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dlg-contenido">
  <form id="frmServicio" [formRoot]="frmServicio" class="grid gap-3 pt-3">
    <mat-form-field appearance="outline">
      <mat-label>Nombre del servicio</mat-label>
      <input matInput placeholder="Wi-Fi" autocomplete="off" [formField]="frmServicio.nombre" />
      @if (frmServicio.nombre().touched() && frmServicio.nombre().invalid()) {
        @for (error of frmServicio.nombre().errors(); track error.kind) {
          <mat-error>{{ error.message }}</mat-error>
        }
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<div class="dlg-pie">
  <button type="button" class="boton-borde" [mat-dialog-close]="false">Cancelar</button>
  <button type="submit" form="frmServicio" class="boton-lleno"><mat-icon>check</mat-icon>Guardar</button>
</div>
