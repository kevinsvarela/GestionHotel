<section class="m-6 tarjeta-tabla">
  <header class="flex flex-wrap items-center justify-between gap-3 p-5">
    <div class="flex items-center gap-3">
      <span class="icono-titulo"><mat-icon>room_service</mat-icon></span>
      <h1 class="text-[1.15rem] font-bold text-[#352D39]">Servicios de habitación</h1>
    </div>
    <div class="flex flex-wrap gap-2">
      <button type="button" class="boton-borde" [class.activo]="panelFilterState()" (click)="toggleFilterPanel()"
        [attr.aria-expanded]="panelFilterState()">
        <mat-icon>{{ panelFilterState() ? 'filter_list_off' : 'filter_list' }}</mat-icon>
        {{ panelFilterState() ? 'Quitar filtro' : 'Filtrar' }}
      </button>
      <button type="button" class="boton-lleno" (click)="onCreate()">
        <mat-icon>add</mat-icon>Nuevo servicio
      </button>
    </div>
  </header>

  @if (panelFilterState()) {
    <div class="caja-filtro grid grid-cols-1 sm:grid-cols-2 gap-x-4">
      <mat-form-field>
        <mat-label>Nombre</mat-label>
        <input matInput [formField]="frmFilter.nombre">
      </mat-form-field>
    </div>
  }

  <div class="overflow-x-auto">
    <table mat-table [dataSource]="dataSource()" class="tabla-hotel">
      <caption class="sr-only">Listado de servicios de habitación</caption>

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> Id </th>
        <td mat-cell *matCellDef="let servicio"> {{servicio.id}} </td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let servicio" class="font-semibold"> {{servicio.nombre}} </td>
      </ng-container>

      <ng-container matColumnDef="botonera">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let servicio">
          <div class="acciones">
            <button mat-icon-button class="accion accion-editar" matTooltip="Editar" aria-label="Editar"
              (click)="onEdit(servicio.id)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button class="accion accion-borrar" matTooltip="Eliminar" aria-label="Eliminar"
              (click)="onDelete(servicio)">
              <mat-icon>delete_outline</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="sin-datos" [attr.colspan]="displayedColumns.length">
          @if (srvServicio.servicios.isLoading()) { Cargando... } @else { No hay servicios para mostrar }
        </td>
      </tr>
    </table>
  </div>

  <mat-paginator [length]="total()" [pageSize]="srvServicio.limit()"
    [pageIndex]="srvServicio.offset() / srvServicio.limit()" [pageSizeOptions]="[10, 20, 50]"
    (page)="onPage($event)" aria-label="Seleccionar página de servicios">
  </mat-paginator>
</section>
