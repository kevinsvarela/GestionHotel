<mat-card class="m-6 bg-white!">
  <div class="p-6 bg-white border-t-8 border-[#155600] rounded-lg shadow-sm">
  <mat-card-header class="bg-[#155600] h-13 justify-center rounded-t-md">
    <mat-card-title class="font-extrabold! text-[1.5rem]! text-white!">
      Catálogo Usuarios
    </mat-card-title>
  </mat-card-header>
  <mat-card-content class="relative overflow-x-auto shadow-sm sm:rounded-lg">
   <table mat-table [dataSource]="dataSource()" class="mat-shadow-2">

  <!-- Id Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef class="font-bold! text-[#352D39]!"> Id </th>
    <td mat-cell *matCellDef="let element"> {{element.id}} </td>
  </ng-container>

  <ng-container matColumnDef="identificacion">
    <th mat-header-cell *matHeaderCellDef class="font-bold! text-[#352D39]!"> Identificación </th>
    <td mat-cell *matCellDef="let element"> {{element.identificacion}} </td>
  </ng-container>

  <!-- Nombre Column -->
  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef class="font-bold! text-[#352D39]!"> Nombre </th>
    <td mat-cell *matCellDef="let element"> {{element.nombre}} {{element.apellidos}} </td>
  </ng-container>

  <!-- Correo Column -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef class="font-bold! text-[#352D39]!"> Correo </th>
    <td mat-cell *matCellDef="let element"> {{element.email}} </td>
  </ng-container>

  <!-- Rol Column -->
  <ng-container matColumnDef="rol_nombre">
    <th mat-header-cell *matHeaderCellDef class="font-bold! text-[#352D39]!"> Rol </th>
    <td mat-cell *matCellDef="let element">
      <span class="px-2 py-1 rounded-full text-xs font-medium bg-[#1E9C99]/15 text-[#156F6D]">{{element.rol_nombre}}</span>
    </td>
  </ng-container>

   <!-- Teléfono Column -->
  <ng-container matColumnDef="telefono">
    <th mat-header-cell *matHeaderCellDef class="font-bold! text-[#352D39]!"> Teléfono </th>
    <td mat-cell *matCellDef="let element"> {{element.telefono}} </td>
  </ng-container>

   <!-- Botonera Column -->
  <ng-container matColumnDef="botonera">
    <th mat-header-cell *matHeaderCellDef style="text-align: center;">
    <button (click)="onCreate()" class=" text-white bg-[#155600] hover:bg-[#0F4000] focus:ring-4 focus:ring-[#155600]/30 font-medium rounded-lg text-sm px-10 py-1 cursor-pointer">
        <mat-icon>add</mat-icon>
    </button>
  </th>
    <td mat-cell *matCellDef="let usuario">
      <div class="flex justify-center gap-1">
        <button (click)="onInfo(usuario.id)" title="Información" class=" flex content-center items-center focus:outline-none text-white bg-[#1E9C99] hover:bg-[#178582] focus:ring-4 focus:ring-[#1E9C99]/30 font-medium rounded-lg text-sm px-2 py-1 cursor-pointer">
          <mat-icon>info</mat-icon>
        </button>
        <button (click)="onEdit(usuario.id)" title="Editar" class=" flex content-center items-center focus:outline-none text-white bg-[#155600] hover:bg-[#0F4000] focus:ring-4 focus:ring-[#155600]/30 font-medium rounded-lg text-sm px-2 py-1 cursor-pointer">
          <mat-icon>edit</mat-icon>
        </button>
        <button (click)="onResetPassword(usuario.id)" title="Restablecer contraseña" class=" flex content-center items-center focus:outline-none text-[#352D39] bg-[#FCDC4D] hover:bg-[#F0CC2E] focus:ring-4 focus:ring-[#FCDC4D]/40 font-medium rounded-lg text-sm px-2 py-1 cursor-pointer">
          <mat-icon>key</mat-icon>
        </button>
        <button (click)="onDelete(usuario.id)" title="Eliminar" class=" flex content-center items-center focus:outline-none text-white bg-[#A72608] hover:bg-[#8C1F06] focus:ring-4 focus:ring-[#A72608]/30 font-medium rounded-lg text-sm px-2 py-1 cursor-pointer">
          <mat-icon>delete</mat-icon>
        </button>
    </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-[#155600]/10!"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-[#155600]/5!"></tr>
</table>
</mat-card-content>
</div>
<mat-card-footer class="flex justify-end p-3">
  <button matFab extended class = "mr-2 bg-[#1E9C99]! text-white!">Filtrar<mat-icon>filter_list</mat-icon></button>
  <button matFab extended class = "bg-[#352D39]! text-white!">Imprimir<mat-icon>print</mat-icon></button>
</mat-card-footer>
</mat-card>
