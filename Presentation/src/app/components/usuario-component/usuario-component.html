<section class="m-6 tarjeta-tabla">
  <header class="flex flex-wrap items-center justify-between gap-3 p-5">
    <div class="flex items-center gap-3">
      <span class="icono-titulo"><mat-icon>manage_accounts</mat-icon></span>
      <h1 class="text-[1.15rem] font-bold text-[#352D39]">Usuarios del sistema</h1>
    </div>
    <div class="flex flex-wrap gap-2">
      <button type="button" class="boton-lleno" (click)="onCreate()">
        <mat-icon>add</mat-icon>Nuevo usuario
      </button>
    </div>
  </header>

  <div class="overflow-x-auto">
    <table mat-table [dataSource]="dataSource()" class="tabla-hotel">
      <caption class="sr-only">Listado de usuarios del sistema</caption>

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> Id </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <ng-container matColumnDef="identificacion">
        <th mat-header-cell *matHeaderCellDef> Identificación </th>
        <td mat-cell *matCellDef="let element"> {{element.identificacion}} </td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let element" class="font-semibold"> {{element.nombre}} {{element.apellidos}} </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Correo </th>
        <td mat-cell *matCellDef="let element"> {{element.email}} </td>
      </ng-container>

      <ng-container matColumnDef="rol_nombre">
        <th mat-header-cell *matHeaderCellDef> Rol </th>
        <td mat-cell *matCellDef="let element">
          <span class="estado" [class]="element.rol_id == 1 ? 'estado-verde' : element.rol_id == 2 ? 'estado-turquesa' : 'estado-gris'">{{element.rol_nombre}}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="telefono">
        <th mat-header-cell *matHeaderCellDef> Teléfono </th>
        <td mat-cell *matCellDef="let element"> {{element.telefono}} </td>
      </ng-container>

      <ng-container matColumnDef="botonera">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let usuario">
          <div class="acciones">
            <button mat-icon-button class="accion accion-info" matTooltip="Ver información" aria-label="Ver información"
              (click)="onInfo(usuario.id)">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button class="accion accion-editar" matTooltip="Editar" aria-label="Editar"
              (click)="onEdit(usuario.id)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button class="accion accion-clave" matTooltip="Restablecer contraseña" aria-label="Restablecer contraseña"
              (click)="onResetPassword(usuario.id)">
              <mat-icon>key</mat-icon>
            </button>
            <button mat-icon-button class="accion accion-borrar" matTooltip="Eliminar" aria-label="Eliminar"
              (click)="onDelete(usuario.id)">
              <mat-icon>delete_outline</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="sin-datos" [attr.colspan]="displayedColumns.length">No hay usuarios para mostrar</td>
      </tr>
    </table>
  </div>
</section>
